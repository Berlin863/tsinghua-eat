<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天吃什么 · 清华食堂决策器</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #2b2622; --muted: #8a8078;
    --accent: #e0533d; --accent-ink: #fff; --line: #ece5db;
    --chip: #f4ede3; --shadow: 0 10px 30px rgba(60, 40, 20, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191614; --card: #242020; --ink: #f0eae2; --muted: #9a9089;
      --accent: #ff6a52; --line: #383028; --chip: #322b26;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 620px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 30px; margin: 8px 0 4px; letter-spacing: 1px; }
  h2 { font-size: 21px; margin: 12px 0 18px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .card {
    background: var(--card); border-radius: 18px; padding: 22px;
    box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  button {
    font: inherit; cursor: pointer; border-radius: 14px; padding: 13px 22px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    transition: transform .06s ease, box-shadow .15s ease;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .55; cursor: wait; }
  button.primary {
    background: var(--accent); color: var(--accent-ink); border: none;
    font-weight: 600; box-shadow: 0 6px 18px rgba(224, 83, 61, .35);
  }
  button.ghost { background: transparent; color: var(--muted); }
  .setup-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .setup-row select, .settings input, .settings select {
    font: inherit; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .progress { height: 8px; border-radius: 99px; background: var(--chip);
    overflow: hidden; margin-bottom: 14px; }
  .progress > div { height: 100%; background: var(--accent); width: 0%;
    transition: width .3s ease; border-radius: 99px; }
  .q-section { color: var(--accent); font-weight: 600; font-size: 14px; }
  .q-meta { color: var(--muted); font-size: 13px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 18px; }
  .options button { text-align: left; padding: 14px 18px; font-size: 16px; }
  .options button:hover { border-color: var(--accent); }
  .skip-row { text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .chip { background: var(--chip); border-radius: 99px; padding: 4px 13px;
    font-size: 13px; }
  .chip.hot { background: var(--accent); color: var(--accent-ink); }
  .section-title { font-size: 17px; margin: 22px 0 10px; }
  .result-card { margin-bottom: 12px; }
  .result-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .rank-no { font-size: 20px; font-weight: 700; color: var(--accent); }
  .canteen { font-size: 13px; color: var(--muted); }
  .dish { font-size: 17px; font-weight: 700; }
  .score { margin-left: auto; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .reasons { margin: 8px 0 0; padding: 0; list-style: none; color: var(--muted);
    font-size: 13px; }
  .reasons li { margin: 3px 0; }
  .reasons b { color: var(--ink); font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 12px; margin-top: 22px; }
  .actions button { flex: 1; padding: 12px 10px; }
  .footnote { color: var(--muted); font-size: 12px; margin-top: 22px;
    text-align: center; }
  .settings { border: 1px dashed var(--line); border-radius: 12px;
    padding: 14px 16px; margin: 18px 0 6px; }
  .settings summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .settings .row { display: flex; gap: 8px; margin: 10px 0 0; flex-wrap: wrap; }
  .settings input[type=password] { flex: 1; min-width: 200px; }
  .settings p { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
  #insight { margin-top: 16px; }
  #insight-text { font-size: 15px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <!-- 开始 -->
  <section id="screen-start" class="card">
    <h1>今天吃什么 🍚</h1>
    <p class="sub" id="db-desc"></p>
    <div class="setup-row">
      <label for="n-questions">聊几道题</label>
      <select id="n-questions">
        <option value="6">6 题(极速)</option>
        <option value="9" selected>9 题(标准)</option>
        <option value="13">13 题(细聊)</option>
      </select>
      <button id="btn-start" class="primary" style="margin-left:auto">开始决策</button>
    </div>
    <details class="settings">
      <summary>⚙️ AI 研判设置(可选)</summary>
      <div class="row">
        <input type="password" id="llm-key" placeholder="Anthropic API Key(sk-ant-…)">
        <select id="llm-model">
          <option value="claude-opus-4-8">Opus 4.8(最强)</option>
          <option value="claude-sonnet-5">Sonnet 5(均衡)</option>
          <option value="claude-haiku-4-5">Haiku 4.5(最省)</option>
        </select>
      </div>
      <p>Key 只保存在你本浏览器(localStorage), 请求由浏览器直连 Anthropic, 不经过任何服务器。
      填了 Key 会多一个"个性化追问"和"AI 研判"; 不填也完全可用。</p>
    </details>
    <p class="footnote">语料来自小红书公开帖子的本地聚合 · 仅供个人参考</p>
  </section>

  <!-- 答题 -->
  <section id="screen-quiz" class="card" hidden>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="q-section" id="q-section"></div>
    <div class="q-meta" id="q-meta"></div>
    <h2 id="q-text"></h2>
    <div class="options" id="q-options"></div>
    <div class="skip-row"><button id="btn-skip" class="ghost">跳过这题 →</button></div>
  </section>

  <!-- AI 追问 -->
  <section id="screen-followup" class="card" hidden>
    <div class="q-section">✨ 个性化追问</div>
    <h2 id="followup-q"></h2>
    <div class="options" id="followup-options"></div>
    <div class="skip-row"><button id="btn-followup-skip" class="ghost">跳过 →</button></div>
  </section>

  <!-- 结果 -->
  <section id="screen-result" hidden>
    <h1>今日吃什么</h1>
    <p class="sub" id="result-desc"></p>
    <div class="card" style="margin-bottom:16px">
      <b>你的干饭画像</b>
      <div class="chips" id="profile"></div>
    </div>
    <div id="sections"></div>
    <div class="card" id="insight" hidden>
      <b>✨ AI 研判</b>
      <p id="insight-text"></p>
    </div>
    <div class="actions">
      <button id="btn-insight" class="primary">✨ AI 研判</button>
      <button id="btn-reroll">🎲 换一批</button>
      <button id="btn-reask" class="ghost">🔁 重新问答</button>
    </div>
    <p class="footnote">分数含随机抖动, 换一批连点越点越野 · 一切以窗口实物为准 :)</p>
  </section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
